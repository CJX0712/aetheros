name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm 版本单一来源 = package.json 的 packageManager（pnpm@9.15.9）。
      # 不要在这里再写 version:，否则 pnpm/action-setup 会报
      # "Multiple versions of pnpm specified" 并直接失败（ERR_PNPM_BAD_PM_VERSION）。
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # 锁文件已入库，CI 必须严格按锁文件安装（漂移即红灯）。
      - run: pnpm install --frozen-lockfile
      # P0 policy gate: no emoji / AI-template icons / purple-pink gradient /
      # hardcoded colors / bounce easing / oversized files.
      - run: pnpm lint:policy
      - run: pnpm check:icons
      - run: pnpm check:fonts
      - run: pnpm typecheck
      - run: pnpm build
      # AC-01 offline baseline: tests run under the offline guard. Outbound must be 0.
      - run: pnpm test:offline
      # Single-file demo headless self-check (AC-06/07/08/09/10 + zero external links).
      - run: pnpm verify:demo
